[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "django-signal-guard"
version = "1.0.0"
description = "Make Django signal failures loud: catch bulk writes that silently skip your pre_save and post_save receivers."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Panos Angelopoulos" }]
requires-python = ">=3.10"
dependencies = ["Django>=5.2"]
keywords = ["django", "signals", "post_save", "bulk_create", "linting", "testing", "pytest"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/panosangelopoulos/django-signal-guard"
Documentation = "https://panosangelopoulos.github.io/django-signal-guard/"
Issues = "https://github.com/panosangelopoulos/django-signal-guard/issues"
Changelog = "https://github.com/panosangelopoulos/django-signal-guard/blob/main/CHANGELOG.md"

[project.entry-points.pytest11]
signal_guard = "signal_guard.pytest_plugin"

[dependency-groups]
test = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-django>=4.9",
    "pytest-xdist>=3.6",
    "requests>=2.34.2",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=1.0,<2",
]
dev = [{ include-group = "test" }, { include-group = "docs" }, "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/signal_guard"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DJ008"]
