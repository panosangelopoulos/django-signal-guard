site_name: django-signal-guard
site_description: Make Django signal failures loud.
site_url: https://panosangelopoulos.github.io/django-signal-guard/
repo_url: https://github.com/panosangelopoulos/django-signal-guard
repo_name: panosangelopoulos/django-signal-guard
edit_uri: edit/main/docs/
copyright: Released under the BSD-3-Clause license.

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_section_style: list
            heading_level: 3
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_bases: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true

validation:
  links:
    anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Checks:
      - Bypass guard: guide/bypass.md
      - Recursion tracing: guide/recursion.md
      - Side effects before commit: guide/side-effects.md
      - System checks: guide/system-checks.md
      - Signal map and signals.lock: guide/signal-map.md
  - Testing:
      - Test assertions: guide/testing.md
      - pytest plugin and baseline: guide/pytest.md
  - Large projects: guide/large-projects.md
  - Reference:
      - Configuration: reference/configuration.md
      - API: reference/api.md
      - signal_guard.testing: reference/testing.md
  - How it works: how-it-works.md
  - Performance: performance.md
  - Stability: stability.md
  - Upgrading to 1.0: upgrading.md
  - Changelog: changelog.md
